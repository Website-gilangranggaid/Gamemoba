<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>MOBA AURORA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
<style>
*{margin:0;box-sizing:border-box}body{background:#050a05;overflow:hidden;font-family:sans-serif;touch-action:none;color:#fff}
#game{display:block;width:100vw;height:100vh}
#ui{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;top:0;left:0;right:0;height:46px;background:linear-gradient(#000,#000a);display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-size:12px;font-weight:bold}
.bar{width:100px;height:10px;background:#222;border-radius:5px;overflow:hidden;display:inline-block;margin-left:4px}
#hpF{height:100%;background:#2ecc71;width:100%}
#ehpF{height:100%;background:#e74c3c;width:100%}
#joy{position:absolute;left:0;bottom:0;width:180px;height:180px;pointer-events:all}
#skills{position:absolute;right:10px;bottom:10px;display:flex;gap:8px;pointer-events:all}
#skills button{width:62px;height:62px;border-radius:50%;border:2px solid #fff;color:#fff;font-weight:bold;font-size:11px}
#atk{background:#c0392b}#s1{background:#2980b9}#s2{background:#f1c40f;color:#000}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
<div id="top"><span>HP<div class="bar"><div id="hpF"></div></div></span><span id="gold">AURORA LVL:1</span><span>ENEMY<div class="bar"><div id="ehpF"></div></div></span></div>
<div id="joy"></div>
<div id="skills"><button id="s1">FREEZE</button><button id="s2">BLIZZARD</button><button id="atk">HIT</button></div>
</div>
<img id="heroImg" src="aurora.png" style="display:none">
<script>
let audioCtx; function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function beep(f,d,t='sine',v=0.3){ initAudio(); let o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type=t; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(v,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+d); o.start(); o.stop(audioCtx.currentTime+d); }

const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
function resize(){cvs.width=innerWidth;cvs.height=innerHeight} resize(); addEventListener('resize',resize);
let player={x:100,y:0,hp:100,max:100,atk:18,speed:4,r:22,vx:0,vy:0,gold:0,lvl:1,exp:0};
let enemy={x:0,y:0,hp:150,r:16};
let bullets=[], effects=[]; player.y=cvs.height/2; enemy.x=cvs.width-120; enemy.y=cvs.height/2;
const heroImg = document.getElementById('heroImg');

let joy=nipplejs.create({zone:document.getElementById('joy'), mode:'static', position:{left:'90px',top:'90px'}, color:'white', size:110});
joy.on('move',(e,d)=>{ if(!d)return; let r=d.angle.radian,f=Math.min(d.force,1); player.vx=Math.cos(r)*f*player.speed; player.vy=-Math.sin(r)*f*player.speed; });
joy.on('end',()=>{player.vx=0;player.vy=0;});

function shoot(ang=0){ let base=Math.atan2(enemy.y-player.y, enemy.x-player.x)+ang; bullets.push({x:player.x,y:player.y,vx:Math.cos(base)*7,vy:Math.sin(base)*7,dmg:player.atk,life:90}); beep(800,0.08,'square',0.2); }
document.getElementById('atk').onclick=()=>{ shoot(0); };
document.getElementById('s1').onclick=()=>{ beep(400,0.2,'sawtooth',0.3); bullets.push({x:player.x,y:player.y,vx:(enemy.x-player.x)/25,vy:(enemy.y-player.y)/25,dmg:30,life:100,type:'ice'}); effects.push({x:player.x,y:player.y,t:20,type:'ice'}); };
document.getElementById('s2').onclick=()=>{ beep(150,0.5,'sawtooth',0.4); for(let a=0;a<6.28;a+=0.4){ bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,dmg:12,life:60,type:'ice'}); } };

function loop(){
  player.x+=player.vx; player.y+=player.vy; player.x=Math.max(30,Math.min(cvs.width-30,player.x)); player.y=Math.max(30,Math.min(cvs.height-30,player.y));
  enemy.x+=(player.x-enemy.x)*0.004; enemy.y+=(player.y-enemy.y)*0.004;
  bullets.forEach((b,i)=>{ b.x+=b.vx; b.y+=b.vy; b.life--; if(b.life<=0){bullets.splice(i,1);return;} if(Math.hypot(b.x-enemy.x,b.y-enemy.y)<20){enemy.hp-=b.dmg; bullets.splice(i,1); player.gold+=5; effects.push({x:enemy.x,y:enemy.y,t:12,type:'hit'}); if(enemy.hp<=0){enemy.hp=150; enemy.x=cvs.width-120; player.lvl++;} } });
  effects.forEach((e,i)=>{e.t--; if(e.t<=0) effects.splice(i,1);});

  ctx.fillStyle='#0d1b2a'; ctx.fillRect(0,0,cvs.width,cvs.height);
  ctx.fillStyle='#1b3a4b'; ctx.fillRect(0,cvs.height/2-120,cvs.width,240);
  
  // ENEMY masih bulat
  ctx.fillStyle='#ff3b3b'; ctx.beginPath(); ctx.arc(enemy.x,enemy.y,enemy.r,0,7); ctx.fill();
  
  // BULLET ES
  bullets.forEach(b=>{ ctx.fillStyle='#00d4ff'; ctx.beginPath(); ctx.arc(b.x,b.y,6,0,7); ctx.fill(); });

  // HERO AURORA - GAMBAR ASLI, BUKAN LINGKARAN
  if(heroImg.complete){
    ctx.save();
    // hadap musuh
    if(player.vx < 0) { ctx.scale(-1,1); ctx.drawImage(heroImg, -player.x-30, player.y-35, 60, 70); }
    else { ctx.drawImage(heroImg, player.x-30, player.y-35, 60, 70); }
    ctx.restore();
  } else {
    ctx.fillStyle='#00d4ff'; ctx.beginPath(); ctx.arc(player.x,player.y,player.r,0,7); ctx.fill();
  }

  document.getElementById('hpF').style.width=(player.hp/player.max*100)+'%';
  document.getElementById('ehpF').style.width=(enemy.hp/150*100)+'%';
  document.getElementById('gold').innerText=`AURORA LVL:${player.lvl} GOLD:${player.gold}`;
  requestAnimationFrame(loop);
} loop();
</script>
</body>
</html>
